# Server settings, the values here are the defaults. Another file: MU_CONFIG=path

[network]
# connect server, the patched client connects to mu.skpd.dev:44405
cs_port = 44405
gs_port = 55901
# game server address the connect server hands to clients, 172.17.0.1 for a client in docker
gs_host = 127.0.0.1

[game]
exp_rate = 100
# multiplies the chance of a monster to drop an item
drop_rate = 10

[database]
# SQLite file, created on the first start
db_path = mu.db
# seconds between saves of the characters in game, they are also saved on logout, level up and shutdown
autosave_interval = 300

[world]
# monster stats and spawns, server files of a later version. Terrain and gates are the client's (data/terrain,
# data/Gate.bmd)
monster_info = data/Monster.txt
monster_spawns = data/MonsterSetBase.txt
# which items drop, have a skill or options (item sizes and requirements are the client's data/item.bmd)
item_info = data/Item.txt
# fixed drops per monster type on top of the random ones, lines of: monster type, item group, item index, item
# level, count (durability, the amount for zen 14 15, 0: the item's own), chance in %. Empty: none
item_drops =
# area radius, effect and classes of the skills (damage, mana and distance are the client's data/skill.bmd)
skill_info = data/Skill.txt
# NPC shops: ShopManager.txt (shop -> NPC type) and a file per shop, a later server's. Prices are the client's
shops = data/shop
# success rate, zen and luck bonus of the chaos machine's mixes, -1: what the client shows
mixes = data/ChaosMix.txt

[accounts]
# the client can't register: the first login with an unknown account name creates the account
auto_create_accounts = yes
# personal code of auto created accounts, the client asks for it to delete a character.
# bin/account.py changes it, creates accounts, sets passwords and bans
personal_code = 1111111

[log]
# DEBUG, INFO, WARNING, ERROR
log_level = INFO
# log every packet in and out, independent of log_level
log_packets = yes
